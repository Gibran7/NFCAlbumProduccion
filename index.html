<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Álbum de Fotos Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var token = '';

          if (search) {
            var sp = new URLSearchParams(search);
            if (sp.has('album')) token = sp.get('album');
          }

          if (!token && hash) {
            var raw = hash.replace(/^#\/?/, '').trim();
            if (raw.indexOf('album=') === 0 || raw.indexOf('?album=') === 0) {
              var hp = new URLSearchParams(raw.replace(/^\?/, ''));
              token = hp.get('album');
            } else if (raw.indexOf('album-') === 0) {
              token = raw.substring(6);
            } else if (raw.indexOf('album/') === 0) {
              token = raw.substring(6);
            } else if (raw.length > 5 && raw !== 'home') {
              token = raw;
            }
          }

          if (token) {
            token = token.trim();
            try {
              localStorage.setItem('nfc_active_album_access_key', token);
            } catch (le) {}
            try {
              document.cookie = 'nfc_active_album=' + encodeURIComponent(token) + '; path=/; max-age=31536000; SameSite=Lax';
            } catch (ce) {}
          }

          // Limpiar la URL de inmediato (quitar hash y param album de la barra de direcciones)
          if (window.location.hash || (search && search.indexOf('album=') !== -1)) {
            var cleanPath = window.location.pathname || '/';
            if (search && search.indexOf('album=') !== -1) {
              var sp2 = new URLSearchParams(search);
              sp2.delete('album');
              var remainingSearch = sp2.toString();
              cleanPath = cleanPath + (remainingSearch ? '?' + remainingSearch : '');
            }
            window.history.replaceState(null, document.title, cleanPath);
          }
        } catch (e) {
          console.error('Error pre-procesando URL:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-gradient-to-br from-amber-50/80 via-rose-50/60 to-sky-50/70 text-slate-800 antialiased min-h-screen selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
